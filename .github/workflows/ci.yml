name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run smoke tests
        run: node --test test/*.test.js

      - name: Smoke test MCP server
        run: |
          (echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}'; \
           sleep 0.5; \
           echo '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'; \
           sleep 0.5) | timeout 10 node bin/clawforge-mcp.js 2>&1 | grep -q "clawforge_produce_video"
